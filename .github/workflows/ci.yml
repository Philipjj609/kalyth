name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Browser tests (G4): the main flows by keyboard and axe accessibility checks, with the
      # runner's preinstalled Chrome and the mock provider.
      - run: pnpm test:e2e

  # Builds the hosted demo's image (ADR 0019) and checks that it starts and serves a session. It is
  # never pushed or deployed from CI: deployment is Philip's step (deploy/README.md).
  demo-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t kalyth-demo:ci .
      - name: Start the image and check it answers
        run: |
          docker run -d --name demo -p 8080:8080 -e KALYTH_DEMO_HOST=127.0.0.1:8080 -e KALYTH_DEMO_LISTEN=0.0.0.0 kalyth-demo:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/v1/health && break; sleep 1; done
          code=$(curl -s -X POST -H 'x-kalyth-ui: 1' -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/demo/session)
          test "$code" = 201
          curl -sf -o /dev/null http://127.0.0.1:8080/
          docker logs demo

  # Scans the full git history with the gitleaks CLI (checksum-verified release binary).
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
      - name: Scan history
        run: ./gitleaks git --redact --verbose .
